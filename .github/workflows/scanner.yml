name: Indigo Quant Scheduled Market Scanner

on:
  schedule:
    # 14:00 UTC = 19:30 IST (Monday to Friday, after NSE EOD publication)
    - cron: '0 14 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    name: Run Quantitative Swing Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Run Diagnostics & Automated Tests
        run: |
          pytest tests -v --tb=short

      - name: Run EOD Scan and Generate Report
        env:
          TEJHQ_API_KEY: ${{ secrets.TEJHQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m indigo_quant.cli init
          python -m indigo_quant.cli scan

      - name: Upload Scan Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: data/
          retention-days: 7
